<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATA PERIZINAN</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* CSS sebelumnya (tidak diubah) */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #header {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-align: center;
            font-size: 1.5em;
        }
        #upload-container {
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #f9f9f9;
            border-bottom: 1px solid #ddd;
        }
        #upload-container input[type="file"] {
            flex: 1;
            margin-right: 10px;
        }
        #upload-container button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 1em;
            margin-left: 5px;
        }
        #upload-container button:hover {
            background-color: #45a049;
        }
        #status {
            padding: 5px;
            text-align: center;
            font-size: 1em;
            color: #4CAF50;
        }
        #map {
            flex: 1;
            height: 100%;
        }
        .leaflet-control-search {
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        .leaflet-control-search input {
            border: none;
            outline: none;
            padding: 5px;
            width: 150px;
        }
        .leaflet-control-search input:focus {
            border: 1px solid #4CAF50;
        }

        /* CSS khusus untuk cetak */
        @media print {
            body {
                margin: 0;
                padding: 0;
                width: 100%;
            }
            .leaflet-control-zoom,
            .leaflet-control-layers,
            .leaflet-control-search {
                display: none !important;
            }
            #status, #upload-container, #printButton, #header {
                display: none;
            }
            #map {
                display: block;
                width: 100%;
                height: 21cm;
                border: 6px double black;
                box-sizing: border-box;
                margin: 0 auto;
            }
            #printTitle {
                display: block !important;
                text-align: center;
                font-size: 24px;
                font-weight: bold;
                margin-bottom: 20px;
                color: #000;
                position: absolute;
                top: 10px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 1000;
            }
            #watermark {
                position: fixed;
                bottom: 5px;
                right: 10px;
                font-size: 7px;
                color: rgba(169, 169, 169, 0.5);
                text-align: right;
                z-index: 1000;
                pointer-events: none;
            }
            .leaflet-control-layers, .leaflet-control-search, .leaflet-control-zoom {
                display: none !important;
            }
            .leaflet-control-attribution {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div id="header">MONITORING DATA PERIZINAN</div>
    <div id="printHeader" style="display: none;">Peta Ganti Rugi Lahan</div>
    <div id="printOverlay" style="display: none;">
        <div id="printMarking">Printed from Web GIS Operational Department</div>
        <div id="printDate"></div>
    </div>
    <div id="upload-container">
        <input type="file" id="shapefile" name="shapefile" accept=".zip">
        <button id="displayButton">Display</button>
        <button id="uploadButton">Upload</button>
        <button id="downloadButton">Download</button>
        <button id="printButton">Print</button>
    </div>
    <div id="status"></div>
    <div id="map"></div>

    <!-- Elemen untuk judul cetak -->
    <div id="printTitle" style="display: none;"></div>
    <!-- Elemen untuk watermark -->
    <div id="watermark" style="display: none;">Dicetak dari Web GIS </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/shpjs@latest/dist/shp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
    <script>
        // Inisialisasi peta
        const map = L.map('map', { zoomControl: false }).setView([-2.5489, 118.0149], 6);

        // Base layers
        const googleSatelliteLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '© Google Maps'
        });
        const openStreetMapLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        });
        const julongMapLayer = L.tileLayer('http://gis.julongindonesia.com:8082/jlg2023/{z}/{x}/{y}.png', {
            attribution: '© GISJulongMap contributors'
        });
        const Airphoto2024MapLayer = L.tileLayer('http://gis.julongindonesia.com:8087/jlg2024/{z}/{x}/{y}.png', {
            attribution: '© GISJulongMap contributors'
        });

        const Airphoto2023MapLayer = L.tileLayer('http://gis.julongindonesia.com:8087/jlg2023/{z}/{x}/{y}.png', {
            attribution: '© GISJulongMap contributors'
        });

        const Airphoto2022MapLayer = L.tileLayer('http://gis.julongindonesia.com:8087/jlg2022/{z}/{x}/{y}.png', {
            attribution: '© GISJulongMap contributors'
        });

        const Airphoto2021MapLayer = L.tileLayer('http://gis.julongindonesia.com:8087/jlg2021/{z}/{x}/{y}.png', {
            attribution: '© GISJulongMap contributors'
        });

        const Airphoto2020MapLayer = L.tileLayer('http://gis.julongindonesia.com:8087/jlg2020/{z}/{x}/{y}.png', {
            attribution: '© GISJulongMap contributors'
        });

        const Airphoto2019MapLayer = L.tileLayer('http://gis.julongindonesia.com:8087/jlg2019/{z}/{x}/{y}.png', {
            attribution: '© GISJulongMap contributors'
        });

        const Airphoto2018MapLayer = L.tileLayer('http://gis.julongindonesia.com:8087/jlg2018/{z}/{x}/{y}.png', {
            attribution: '© GISJulongMap contributors'
        });

        // Membuat group dan subgroup
        const baseMapGroup = {
            "Google Satellite": googleSatelliteLayer,
            "OpenStreetMap": openStreetMapLayer,

        };

        const julongMapGroup = {
            "JulongMap": julongMapLayer,
            "Airphoto 2024": Airphoto2024MapLayer,
            "Airphoto 2023": Airphoto2023MapLayer,
            "Airphoto 2022": Airphoto2022MapLayer,
            "Airphoto 2021": Airphoto2021MapLayer,
            "Airphoto 2020": Airphoto2020MapLayer,
            "Airphoto 2019": Airphoto2019MapLayer,
            "Airphoto 2018": Airphoto2018MapLayer
        };

        // Kontrol layer
        const layerControl = L.control.layers(baseMapGroup, {}).addTo(map);
//        googleSatelliteLayer.addTo(map);
		openStreetMapLayer.addTo(map);
        L.control.zoom({ position: 'topright' }).addTo(map);

        // Menambahkan subgroup ke layer control
        layerControl.addOverlay(julongMapLayer, "Julong Map");
        layerControl.addOverlay(Airphoto2024MapLayer, "Airphoto 2024");
        layerControl.addOverlay(Airphoto2023MapLayer, "Airphoto 2023");
        layerControl.addOverlay(Airphoto2022MapLayer, "Airphoto 2022");
        layerControl.addOverlay(Airphoto2021MapLayer, "Airphoto 2021");
        layerControl.addOverlay(Airphoto2020MapLayer, "Airphoto 2020");
        layerControl.addOverlay(Airphoto2019MapLayer, "Airphoto 2019");
        layerControl.addOverlay(Airphoto2018MapLayer, "Airphoto 2018");

        // Fungsi untuk menambahkan background layer (HGU dan JLG Planted)
        async function addBackgroundLayer(url, style, name) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to load background shapefile.');

                const arrayBuffer = await response.arrayBuffer();
                const geojson = await shp(arrayBuffer);

                const layer = L.geoJSON(geojson, {
                    style: style,
                    onEachFeature: (feature, layer) => {
                        if (feature.properties) {
                            const popupContent = `
                                <b>Properties:</b><br>
                                ${Object.entries(feature.properties)
                                    .map(([key, value]) => `<b>${key}:</b> ${value}`)
                                    .join('<br>')}
                            `;
                            layer.bindPopup(popupContent);
                        }
                    }
                });

                // Tambahkan layer ke overlayLayers dan kontrol layer
                layerControl.addOverlay(layer, name);
                layer.addTo(map); // Tampilkan layer secara default
            } catch (error) {
                console.error(`Error loading ${name} shapefile:`, error);
            }
        }

        // Memuat background layer (HGU, ILOK, KADASTRAL dan JLG Planted)
        addBackgroundLayer('background/hgu.zip', {
            color: '#000000',
            weight: 3,
            opacity: 1,
            fillColor: '#268f06',
            fillOpacity: 0.0
        }, 'HGU');
		
        addBackgroundLayer('background/jlg_iup.zip', {
            color: '#0000ff',
            weight: 3,
            opacity: 1,
			dashArray: '8, 8', // Menjadikan garis putus-putus (5px garis, 5px jarak)			
            fillColor: '#0000ff.',
            fillOpacity: 0.0
        }, 'IUP');
		
        addBackgroundLayer('background/Location_permit.zip', {
            color: '#ff0000',
            weight: 3,
            opacity: 1,
			dashArray: '8, 8', // Menjadikan garis putus-putus (5px garis, 5px jarak)			
            fillColor: '#268f06',
            fillOpacity: 0.0
        }, 'Izin Lokasi');
		
        addBackgroundLayer('background/jlg_kadastral.zip', {
            color: '#FFFF00',
            weight: 3,
            opacity: 1,
//			dashArray: '5, 7', // Menjadikan garis putus-putus (5px garis, 5px jarak)
            fillColor: '#268f06',
            fillOpacity: 0.0
        }, 'Kadastral');
		
        addBackgroundLayer('background/jlg_planted.zip', {
            color: '#268f06',
            weight: 2,
            opacity: 1,
            fillColor: '#268f06',
            fillOpacity: 0.4
        }, 'Planted');

        // Fungsi untuk menambahkan layer cuaca (awan)
        function addWeatherLayer() {
            const weatherLayer = L.tileLayer('https://tile.openweathermap.org/map/{layer}/{z}/{x}/{y}.png?appid={apiKey}', {
                layer: 'clouds_new',
                apiKey: '744b69a507275404794b3ff8a6869c45', // Ganti dengan API key OpenWeatherMap Anda
                attribution: '© OpenWeatherMap'
            });

            layerControl.addOverlay(weatherLayer, 'Kondisi Awan');
 //           weatherLayer.addTo(map); // Tampilkan layer cuaca secara default
        }

        // Fungsi untuk menambahkan layer cuaca hujan (presipitasi)
        function addPrecipitationLayer() {
            const precipitationLayer = L.tileLayer('https://tile.openweathermap.org/map/{layer}/{z}/{x}/{y}.png?appid={apiKey}', {
                layer: 'precipitation_new',
                apiKey: '744b69a507275404794b3ff8a6869c45', // Ganti dengan API key OpenWeatherMap Anda
                attribution: '© OpenWeatherMap'
            });

            layerControl.addOverlay(precipitationLayer, 'Kondisi Hujan');
//            precipitationLayer.addTo(map); // Tampilkan layer cuaca hujan secara default
        }

        // Tambahkan layer cuaca dan hujan
        addWeatherLayer();
        addPrecipitationLayer();

        // Fungsi untuk menampilkan shapefile
        document.getElementById('displayButton').addEventListener('click', function () {
            const fileInput = document.getElementById('shapefile');
            if (fileInput.files.length === 0) {
                alert('Silakan pilih file shapefile (.zip) terlebih dahulu.');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function (e) {
                const arrayBuffer = e.target.result;

                // Proses file shapefile menggunakan shpjs
                shp(arrayBuffer).then(function (geojson) {
                    // Hapus layer sebelumnya jika ada
                    if (window.shapefileLayer) {
                        map.removeLayer(window.shapefileLayer);
                    }

                    // Tambahkan layer baru ke peta
                    window.shapefileLayer = L.geoJSON(geojson, {
                        style: {
                            color: '#ff7800',
                            weight: 2,
                            opacity: 1,
                            fillColor: '#ff7800',
                            fillOpacity: 0.4
                        },
                        onEachFeature: function (feature, layer) {
                            if (feature.properties) {
                                const popupContent = `
                                    <b>Properties:</b><br>
                                    ${Object.entries(feature.properties)
                                        .map(([key, value]) => `<b>${key}:</b> ${value}`)
                                        .join('<br>')}
                                `;
                                layer.bindPopup(popupContent);
                            }
                        }
                    }).addTo(map);

                    // Fit bounds ke layer yang baru ditambahkan
                    map.fitBounds(window.shapefileLayer.getBounds());

                    // Update status
                    document.getElementById('status').textContent = 'Shapefile berhasil ditampilkan.';
                }).catch(function (error) {
                    console.error('Error processing shapefile:', error);
                    document.getElementById('status').textContent = 'Gagal memproses shapefile.';
                });
            };

            reader.onerror = function (error) {
                console.error('Error reading file:', error);
                document.getElementById('status').textContent = 'Gagal membaca file.';
            };

            reader.readAsArrayBuffer(file);
        });

        // Fungsi untuk mengunggah shapefile
        document.getElementById('uploadButton').addEventListener('click', function () {
            const fileInput = document.getElementById('shapefile');
            if (fileInput.files.length === 0) {
                alert('Silakan pilih file shapefile (.zip) terlebih dahulu.');
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('shapefile', file);

            fetch('upload.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('status').textContent = 'File berhasil diunggah.';
                    // Tampilkan file yang baru diunggah di peta
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const arrayBuffer = e.target.result;
                        shp(arrayBuffer).then(function (geojson) {
                            const layer = L.geoJSON(geojson, {
                                style: {
                                    color: '#ff7800',
                                    weight: 2,
                                    opacity: 1,
                                    fillColor: '#ff7800',
                                    fillOpacity: 0.4
                                },
                                onEachFeature: function (feature, layer) {
                                    if (feature.properties) {
                                        const popupContent = `
                                            <b>Properties:</b><br>
                                            ${Object.entries(feature.properties)
                                                .map(([key, value]) => `<b>${key}:</b> ${value}`)
                                                .join('<br>')}
                                        `;
                                        layer.bindPopup(popupContent);
                                    }
                                }
                            }).addTo(map);

                            // Tambahkan layer ke kontrol layer
                            layerControl.addOverlay(layer, `Shapefile: ${data.file}`);
                        });
                    };
                    reader.readAsArrayBuffer(file);
                } else {
                    document.getElementById('status').textContent = 'Gagal mengunggah file: ' + data.message;
                }
            })
            .catch(error => {
                console.error('Error uploading file:', error);
                document.getElementById('status').textContent = 'Gagal mengunggah file.';
            });
        });

        // Fungsi untuk mengunduh file
        document.getElementById('downloadButton').addEventListener('click', function () {
            // Buka halaman download.html di tab baru
            window.open('download.html', '_blank');
        });

        // Fungsi untuk mencetak peta
        document.getElementById('printButton').addEventListener('click', function () {
            const title = prompt('Masukkan judul cetak:', 'Judul Peta');
            const printTitleElement = document.getElementById('printTitle');

            if (title) {
                printTitleElement.textContent = title.toUpperCase();
                printTitleElement.style.display = 'block'; // Tampilkan judul sebelum mencetak
            } else {
                printTitleElement.textContent = '';
            }

            // Mendapatkan koordinat batas peta (bounding box)
            const bounds = map.getBounds();
            const north = bounds.getNorth().toFixed(5);
            const south = bounds.getSouth().toFixed(5);
            const east = bounds.getEast().toFixed(5);
            const west = bounds.getWest().toFixed(5);

            const coordinates = `Batas Peta: 
                Utara: ${north}, 
                Selatan: ${south}, 
                Timur: ${east}, 
                Barat: ${west}`;

            const printDateElement = document.getElementById('printDate');
            const currentDate = new Date();
            const formattedDate = currentDate.toLocaleDateString('id-ID', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
            });
            printDateElement.textContent = `Tanggal Cetak: ${formattedDate}`;

            // Menampilkan koordinat di watermark
            const watermark = document.getElementById('watermark');
            watermark.innerHTML = `
                <span>Di Cetak Dari WebGIS Operational Department</span>
                <br><span>${coordinates}</span>
                <br><span id="printDate">${formattedDate}</span>
            `;

            window.print();
        });

        // Fungsi untuk mengambil daftar file ZIP dari server
        async function fetchUploadedShapefiles() {
            try {
                const response = await fetch('get_uploaded_files.php'); // Endpoint untuk mengambil daftar file
                if (!response.ok) throw new Error('Failed to fetch uploaded files.');

                const files = await response.json();
                return files;
            } catch (error) {
                console.error('Error fetching uploaded files:', error);
                return [];
            }
        }

        // Fungsi untuk menampilkan file ZIP di peta
        async function displayUploadedShapefiles() {
            const files = await fetchUploadedShapefiles();

            files.forEach(async (file) => {
                const response = await fetch(`uploads/${file}`);
                if (!response.ok) return;

                const arrayBuffer = await response.arrayBuffer();
                const geojson = await shp(arrayBuffer);

                const layer = L.geoJSON(geojson, {
                    style: {
                        color: '#ff7800',
                        weight: 2,
                        opacity: 1,
                        fillColor: '#ff7800',
                        fillOpacity: 0.4
                    },
                    onEachFeature: (feature, layer) => {
                        if (feature.properties) {
                            const popupContent = `
                                <b>Properties:</b><br>
                                ${Object.entries(feature.properties)
                                    .map(([key, value]) => `<b>${key}:</b> ${value}`)
                                    .join('<br>')}
                            `;
                            layer.bindPopup(popupContent);
                        }
                    }
                }).addTo(map);

                // Tambahkan layer ke kontrol layer
                layerControl.addOverlay(layer, `Shapefile: ${file}`);
            });
        }

        // Panggil fungsi untuk menampilkan file ZIP saat halaman dimuat
        displayUploadedShapefiles();
    </script>
</body>
</html>
